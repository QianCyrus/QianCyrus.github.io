<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1440" viewBox="0 0 850 1440" role="img" aria-labelledby="title desc">
<title id="title">先做通用融合，再独立比较 SM120 配置</title><desc id="desc">白板机制图。上半展示gated RMSNorm多个张量操作融合为单个Triton kernel，同时保留归一化后BF16舍入；下半展示GDN程序按请求、head和value列tile分工，每个程序保留完整128维key轴、按token时间顺序执行QK归一化与FP32状态递推。投影、卷积、g和beta准备、gated norm与输出投影仍在递推kernel外。最后区分通用tile32和4warps与后续SM120调参。不是kernel实测时间线或性能曲线。</desc>
<style>text{font-family:"Comic Sans MS","Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#292929;font-size:20px}.small{font-size:18px}.title{font-size:25px}.label{font-size:22px}.tiny{font-size:16px}path,line{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1.5 9" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker></defs>
<path d="M0 0H850V1440H0Z" fill="white"/>
<text x="28" y="37" class="title" style="fill:#292929" text-anchor="start">先减少中间读写，再看硬件配置是否值得改</text>
<text x="28" y="73" class="label" style="fill:#1976d2" text-anchor="start">(a) 第一次融合：gated RMSNorm</text>
<text x="28" y="108" class="small" style="fill:#707070" text-anchor="start">Reference：下图是张量操作依赖，不等于 5 个实际 kernel。</text>
<path d="M42 130.5 Q93.0 128.7 144 129.9 Q159.1 130 158.2 144 L157.1 173 Q158 188.5 144 187.8 Q93.0 186.4 42 187.1 Q27 187 28.1 173 L28.9 144 Q27.2 129.2 42 129.7 Z" fill="white" stroke="#1976d2" stroke-width="1.8"/>
<text x="93.0" y="166" class="small" style="fill:#1976d2" text-anchor="middle">RMS / FP32</text>
<path d="M201 130.8 Q242.0 128.7 283 129.0 Q298.1 130 297.9 144 L296.7 173 Q297 188.5 283 185.9 Q242.0 186.4 201 187.6 Q186 187 186.9 173 L187.1 144 Q186.2 129.2 201 130.0 Z" fill="white" stroke="#e64b45" stroke-width="1.8"/>
<text x="242.0" y="166" class="small" style="fill:#e64b45" text-anchor="middle">cast BF16</text>
<path d="M340 129.2 Q398.5 128.7 457 131.0 Q472.1 130 471.2 144 L472.0 173 Q471 188.5 457 185.9 Q398.5 186.4 340 187.6 Q325 187 326.3 173 L326.2 144 Q325.2 129.2 340 129.3 Z" fill="white" stroke="#292929" stroke-width="1.8"/>
<text x="398.5" y="166" class="small" style="fill:#292929" text-anchor="middle">× weight</text>
<path d="M514 130.4 Q572.5 128.7 631 130.0 Q646.1 130 644.4 144 L644.5 173 Q645 188.5 631 186.1 Q572.5 186.4 514 187.0 Q499 187 501.0 173 L500.9 144 Q499.2 129.2 514 130.4 Z" fill="white" stroke="#292929" stroke-width="1.8"/>
<text x="572.5" y="166" class="small" style="fill:#292929" text-anchor="middle">× SiLU(z)</text>
<path d="M688 129.5 Q748.0 128.7 808 129.5 Q823.1 130 822.5 144 L821.5 173 Q822 188.5 808 187.6 Q748.0 186.4 688 186.2 Q673 187 673.6 173 L673.8 144 Q673.2 129.2 688 129.1 Z" fill="white" stroke="#1976d2" stroke-width="1.8"/>
<text x="748.0" y="166" class="small" style="fill:#1976d2" text-anchor="middle">输出 BF16</text>
<path d="M160 159 Q170.5 157 181 159" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M299 159 Q309.5 157 320 159" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M473 159 Q483.5 157 494 159" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M647 159 Q657.5 157 668 159" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M426 195 Q425 209 426 225" fill="none" stroke="#2a9d48" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M42 236.5 Q425.0 235.7 808 237.0 Q823.1 237 821.9 251 L821.6 374 Q822 389.5 808 387.4 Q425.0 387.4 42 386.9 Q27 388 27.7 374 L29.0 251 Q27.2 236.2 42 236.7 Z" fill="white" stroke="#2a9d48" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="48" y="270" class="" style="fill:#2a9d48" text-anchor="start">一个通用 Triton kernel · 每行对应一个 token / head</text>
<text x="48" y="307" class="small" style="fill:#292929" text-anchor="start">FP32 RMS → BF16 舍入 → × FP32 weight → × FP32 SiLU(z)</text>
<path d="M192 315 Q228 320 301 315" fill="none" stroke="#e64b45" stroke-width="1.8"/>
<text x="48" y="342" class="small" style="fill:#e64b45" text-anchor="start">先转回输入 dtype 的边界仍在；最后 store 再转为 BF16。</text>
<text x="48" y="372" class="small" style="fill:#707070" text-anchor="start">这是 4B 的 FP32 weight 路径；没有把 (1 + weight) 移植进来。</text>
<text x="28" y="433" class="label" style="fill:#2a9d48" text-anchor="start">(b) 第二次融合：GDN 的 Q/K 归一化 + 状态递推</text>
<text x="28" y="468" class="small" style="fill:#707070" text-anchor="start">融合边界必须画清楚：整层 GDN 仍有其它算子。</text>
<path d="M42 490.9 Q146.5 488.7 251 489.9 Q266.1 490 264.6 504 L264.3 561 Q265 576.5 251 574.1 Q146.5 574.4 42 574.2 Q27 575 28.0 561 L29.0 504 Q27.2 489.2 42 491.0 Z" fill="white" stroke="#1976d2" stroke-width="1.8"/>
