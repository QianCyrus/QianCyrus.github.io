<svg xmlns="http://www.w3.org/2000/svg" width="850" height="686" viewBox="0 0 850 686" role="img" aria-labelledby="title desc"><title id="title">Greedy MTP: candidate verification and state commit</title><desc id="desc">Illustrative k = 3 example. The initial target state has length c; pending token p has been emitted but not consumed. The draft proposes three candidates. A target-state clone verifies p, d1, d2, d3; only d1 and d2 are accepted. Replay p, d1, d2 from the original state to commit target length c + 3. Obtain the bonus from replay logits and rebuild MTP state using target hidden states. Return d1, d2, bonus; the bonus is pending for the next round.</desc>
<style>text{font-family:Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#29313a;font-size:16px} .title{font-size:20px;font-weight:600}.label{font-size:17px;font-weight:600}.small{font-size:14px;fill:#596574}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.line{fill:none;stroke:#5d6874;stroke-width:1.3}.arrow{fill:none;stroke:#5d6874;stroke-width:1.3;marker-end:url(#arrow)}.blue{fill:#eaf2f9;stroke:#2e608f;stroke-width:1.4}.box{fill:white;stroke:#73808d;stroke-width:1.2}.dash{fill:#fffaf5;stroke:#b3793e;stroke-width:1.4;stroke-dasharray:5 3}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5d6874" /></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7"><path d="M0 7L7 0" stroke="#d9bc9d" stroke-width="1" /></pattern></defs>
<rect width="850" height="686" fill="white" />
<text x="24" y="31" class="title">MTP: verification results must match the committed state</text>
<text x="24" y="58" class="small">Illustrative greedy example: k = 3, two candidates accepted. Not a measured trace.</text>
<text x="24" y="92" class="label">(a) Derive temporary branches from committed state</text>
<rect x="24" y="108" width="230" height="89" class="blue" />
<text x="139" y="137" class="label" text-anchor="middle">Committed target: S_c</text>
<text x="139" y="162" class="mono" text-anchor="middle">pending = p</text>
<text x="139" y="184" class="small" text-anchor="middle">p emitted; not yet consumed</text>
<path d="M256 151 H291" class="arrow" />
<rect x="297" y="108" width="236" height="89" class="box" />
<text x="415" y="137" class="label" text-anchor="middle">Draft rollout</text>
<text x="415" y="162" class="mono" text-anchor="middle">d₁ → d₂ → d₃</text>
<text x="415" y="184" class="small" text-anchor="middle">Propose from a cloned MTP state</text>
<path d="M535 151 H570" class="arrow" />
<rect x="576" y="108" width="250" height="89" class="box" />
<text x="701" y="137" class="label" text-anchor="middle">Target verify · clone(S_c)</text>
<text x="701" y="163" class="mono" text-anchor="middle">Consume [p, d₁, d₂, d₃]</text>
<text x="701" y="184" class="small" text-anchor="middle">Verification clone length: c + 4</text>
<path d="M701 198 V227" class="arrow" />
<rect x="340" y="234" width="486" height="93" class="box" />
<text x="359" y="260" class="label">Match candidates against target greedy</text>
<rect x="363" y="275" width="135" height="35" class="blue" />
<text x="430.5" y="299" text-anchor="middle">d₁: accept</text>
<rect x="512" y="275" width="135" height="35" class="blue" />
<text x="579.5" y="299" text-anchor="middle">d₂: accept</text>
<rect x="661" y="275" width="135" height="35" class="dash" />
<text x="728.5" y="299" text-anchor="middle">d₃: reject</text>
<text x="24" y="252" class="label">Temporary state is not final</text>
<text x="24" y="277" class="small">State beyond the accepted prefix</text>
<text x="24" y="299" class="small">is not part of the output; discard it.</text>
<text x="24" y="366" class="label">(b) Replay the accepted prefix, then commit both states</text>
<path d="M701 329 V380 H189 V390" class="arrow" />
<rect x="24" y="397" width="330" height="103" class="blue" />
<text x="189" y="425" class="label" text-anchor="middle">Replay from the original S_c</text>
<text x="189" y="452" class="mono" text-anchor="middle">Consume [p, d₁, d₂] → S_(c+3)</text>
<text x="189" y="477" class="small" text-anchor="middle">bonus ← final logits of the actual replay</text>
<path d="M356 449 H390" class="arrow" />
<rect x="397" y="397" width="429" height="103" class="box" />
<text x="611" y="425" class="label" text-anchor="middle">Teacher forcing: rebuild MTP state</text>
<text x="611" y="451" class="small" text-anchor="middle">Use true target hidden; discard draft rollout state</text>
<text x="611" y="477" class="mono small" text-anchor="middle">MTP.length = target.length − 1 = c + 2</text>
<path d="M189 502 V527 H427 V548" class="arrow" />
<path d="M611 502 V527 H427" class="arrow" />
<rect x="162" y="554" width="532" height="63" class="blue" />
<text x="428" y="580" class="label" text-anchor="middle">Publish state + return [d₁, d₂, bonus]</text>
<text x="428" y="604" class="small" text-anchor="middle">pending ← bonus; emitted now, consumed next round</text>
<text x="24" y="652" class="small">Blue: retained state / candidates. Dashed: rejected candidate. Uses clone / replay, not paged rollback.</text>
<text x="24" y="676" class="small">Model-specific state protocol: rebuild draft state with target hidden even when all candidates are accepted.</text>
</svg>