<text x="48" y="270" class="" style="fill:#2a9d48" text-anchor="start">One portable Triton kernel · one row per token / head</text>
<text x="48" y="307" class="small" style="fill:#292929" text-anchor="start">FP32 RMS → BF16 rounding → × FP32 weight → × FP32 SiLU(z)</text>
<path d="M192 315 Q228 320 301 315" fill="none" stroke="#e64b45" stroke-width="1.8" />
<text x="48" y="342" class="small" style="fill:#e64b45" text-anchor="start">Keep the cast back to input dtype; cast to BF16 again at the final store.</text>
<text x="48" y="372" class="small" style="fill:#707070" text-anchor="start">This is the 4B FP32-weight path; it does not introduce (1 + weight).</text>
<text x="28" y="433" class="label" style="fill:#2a9d48" text-anchor="start">(b) Second fusion: GDN Q/K normalization + state recurrence</text>
<text x="28" y="468" class="small" style="fill:#707070" text-anchor="start">Keep the boundary explicit: the full GDN layer still contains other operators.</text>
