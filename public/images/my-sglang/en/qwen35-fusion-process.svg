<text x="626" y="806" class="" style="fill:#2a9d48" text-anchor="middle">② for t = 0 … T−1</text>
<text x="472" y="841" class="small" style="fill:#292929" text-anchor="start">Q/K norm: keep input-dtype rounding</text>
<text x="472" y="873" class="small" style="fill:#292929" text-anchor="start">Decay → memory → delta → update</text>
<text x="472" y="905" class="small" style="fill:#292929" text-anchor="start">Read current output y[t, value tile]</text>
<text x="472" y="941" class="small" style="fill:#2a9d48" text-anchor="start">Advance this state tile in token order</text>
<path d="M806 944 Q822 871 806 810" fill="none" stroke="#2a9d48" stroke-width="1.8" marker-end="url(#arr)" />
<path d="M622 975 Q621 987 622 999" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arr)" />
<text x="449" y="1030" class="small" style="fill:#292929" text-anchor="start">③ Write a separate new state tile</text>
<text x="28" y="1102" class="small" style="fill:#292929" text-anchor="start">Value tiles run in parallel; recurrence within each tile is sequential in time.</text>
<text x="28" y="1133" class="small" style="fill:#707070" text-anchor="start">grid = (B × H, 128 / VALUE_TILE); output state does not overwrite old state.</text>
<text x="28" y="1181" class="label" style="fill:#ee8a16" text-anchor="start">Two experimental stages, not one jump to “optimal parameters”</text>
