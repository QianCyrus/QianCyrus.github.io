<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1440" viewBox="0 0 850 1440" role="img" aria-labelledby="title desc">
<title id="title">First fuse portable operators, then compare SM120 configurations separately</title><desc id="desc">Whiteboard mechanism sketch. The upper panel fuses gated RMSNorm tensor operations into one Triton kernel while retaining BF16 rounding after normalization. The lower panel assigns GDN programs by request, head, and value-column tile. Each program retains the full 128-dimensional key axis and applies Q/K normalization and FP32 state recurrence in token order. Projection, convolution, preparation of g and beta, gated norm, and output projection remain outside the recurrence kernel. The final panel separates the portable tile-32, four-warp implementation from subsequent SM120 tuning. This is not a measured kernel timeline or performance curve.</desc>
<style>text{font-family:"Comic Sans MS","Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#292929;font-size:20px}.small{font-size:18px}.title{font-size:25px}.label{font-size:22px}.tiny{font-size:16px}path,line{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1.5 9" fill="none" stroke="context-stroke" stroke-width="1.7" /></marker></defs>
<path d="M0 0H850V1440H0Z" fill="white" />
