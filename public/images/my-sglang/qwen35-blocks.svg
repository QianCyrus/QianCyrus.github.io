<text x="425" y="611" class="label orange" text-anchor="middle">原生 MTP · 独立预测分支</text>
<text x="425" y="647" text-anchor="middle">token embedding 与前位 hidden：分别 norm → concat → FC</text>
<text x="425" y="679" text-anchor="middle">1 层 Full Attention + 独立状态 → 共享输出头</text>
<text x="425" y="734" class="small orange" text-anchor="middle">MTP 共享 E / head；它不是主干的第 33 层</text>
<text x="30" y="776" class="small">绿色：GDN 状态；蓝色：Attention 状态；橙色虚线：独立辅助分支。</text>
<text x="30" y="801" class="small">机制示意，非真实执行时间线；省略层内投影与残差细节。</text>
