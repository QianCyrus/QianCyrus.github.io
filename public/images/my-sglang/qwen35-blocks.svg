<svg xmlns="http://www.w3.org/2000/svg" width="850" height="814" viewBox="0 0 850 814" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.5-4B：主干、两类状态与独立MTP</title><desc id="desc">4B文本主干使用绑定词嵌入与输出头，32层按三个GDN和一个gated attention重复八组。24个GDN层保留卷积窗口和FP32循环状态，8个完整Attention层保留增长的KV历史。独立MTP分支共享嵌入和输出头，但有独立状态，不是主干第33层。</desc>
