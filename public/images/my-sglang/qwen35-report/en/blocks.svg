<svg xmlns="http://www.w3.org/2000/svg" width="850" height="830" viewBox="0 0 850 830" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.5-4B: hybrid backbone and per-request state</title><desc id="desc">The text backbone repeats three GDN layers and one full-attention layer eight times. Its 24 GDN layers retain fixed-size convolution windows and FP32 recurrent matrices; its eight attention layers retain growing KV history. Packed tokens share each layer projection; stateful operations use request segments and keep KV, convolution, and recurrent state separate for every request.</desc>
